services:
  redis:
    image: redis:alpine
    container_name: chatbot-redis-dev
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    # command: ["redis-server", "--appendonly", "yes", "--requirepass", "123456"]
    networks:
      - chatbot-shared
    restart: unless-stopped

  mqtt-broker:
    image: eclipse-mosquitto
    container_name: chatbot-mqtt-dev
    ports:
      - "1883:1883"
      - "9001:9001"
    networks:
      - chatbot-shared
    restart: unless-stopped

  db:
    image: postgres:14
    container_name: chatbot-db-dev
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=api_proxy
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - chatbot-shared
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: media-minio-dev
    ports:
      - "9002:9000"
      - "9003:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_BROWSER_REDIRECT_URL: "http://13.212.186.227/minio"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - chatbot-shared
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  minio_data:
    name: minio_data
  postgres_data: 
    name: postgres_data
  redis_data:
    name: redis_data

networks:
  chatbot-shared:
    external: true
    name: chatbot-shared