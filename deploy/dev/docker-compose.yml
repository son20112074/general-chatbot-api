services:
  chatbot-api:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: ${IMAGE_NAME:-chatbot-api-dev}:${IMAGE_TAG:-latest}
    container_name: chatbot-api-dev
    # Host port 8000 matches the existing nginx reverse-proxy config
    # at /etc/nginx/sites-enabled/default (location / → localhost:8000).
    ports:
      - "8000:8000"
    volumes:
      - ../..:/app
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - db
      - redis
      - mqtt-broker
    networks:
      - default
      - chatbot-shared
    restart: unless-stopped

  redis:
    image: redis:alpine
    container_name: chatbot-redis-dev
    ports:
      - "6399:6379"
    networks:
      - default
      - chatbot-shared
    restart: unless-stopped

  mqtt-broker:
    image: eclipse-mosquitto
    container_name: chatbot-mqtt-dev
    ports:
      - "1893:1883"
      - "9011:9001"
    networks:
      - default
      - chatbot-shared
    restart: unless-stopped

  db:
    image: postgres:14
    container_name: chatbot-db-dev
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=api_proxy
    ports:
      - "5442:5432"
    networks:
      - default
      - chatbot-shared
    restart: unless-stopped

networks:
  default:
  chatbot-shared:
    external: true
    name: chatbot-shared
